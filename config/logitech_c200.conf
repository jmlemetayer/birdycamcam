# Video device (V4L2 node).
# Run: v4l2-ctl --list-devices
VIDEO_DEVICE=/dev/video0

# Capture resolution and framerate supported by the webcam.
VIDEO_SIZE=640x480
VIDEO_FRAMERATE=30

# Audio device (ALSA card/device).
# Run: arecord -l
AUDIO_DEVICE=hw:1,0

# Sample format supported by the webcam microphone.
# Run: cat /proc/asound/cardN/stream0
AUDIO_FORMAT=S16_LE

# Sample rate (Hz) and channel count supported by the webcam microphone.
AUDIO_SAMPLE_RATE=48000
AUDIO_CHANNELS=1
