# Webcam configuration file for BirdyCamCam.
#
# Copy this file, rename it to match your webcam (e.g. logitech_c920.conf),
# and override only the values that differ from the defaults.
#
# Then activate it:
#   sudo install -m 644 config/<your_webcam>.conf /etc/birdy/<your_webcam>.conf
#   sudo ln -sf /etc/birdy/<your_webcam>.conf /etc/birdy/birdy.conf
#   sudo systemctl restart birdy

# -----------------------------------------------------------------------------
# Video
# -----------------------------------------------------------------------------

# V4L2 device node for the webcam. Mandatory.
# Run: v4l2-ctl --list-devices
# Use the first entry listed under your camera.
VIDEO_DEVICE=/dev/videoN

# Capture resolution. Must be supported by the webcam.
# Run: v4l2-ctl -d ${VIDEO_DEVICE} --list-formats-ext
#VIDEO_SIZE=640x480

# Capture framerate. Must be supported by the webcam at the chosen resolution.
#VIDEO_FRAMERATE=30

# -----------------------------------------------------------------------------
# Audio
# -----------------------------------------------------------------------------

# ALSA device for the webcam microphone (card,device). Mandatory.
# Run: arecord -l
# Use the card and device numbers shown (e.g. hw:1,0 for card 1, device 0).
AUDIO_DEVICE=hw:N,0

# Sample format supported by the microphone.
# Run: cat /proc/asound/cardN/stream0
# Look for the Format field under the Capture section.
#AUDIO_FORMAT=S16_LE

# Sample rate (Hz) supported by the microphone.
# Run: cat /proc/asound/cardN/stream0
# Look for the Rates field under the Capture section.
#AUDIO_SAMPLE_RATE=48000

# Number of audio channels (1 = mono, 2 = stereo).
#AUDIO_CHANNELS=1

# -----------------------------------------------------------------------------
# Startup
# -----------------------------------------------------------------------------

# Delay (seconds) after the audio device becomes available before starting
# FFmpeg. Increase if audio is silent or glitchy on the first seconds after
# boot.
#STARTUP_DELAY=10
